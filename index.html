<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BOULD</title>
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; background: #14121f; overflow: hidden; touch-action: none; }
  html { -webkit-text-size-adjust: 100%; -webkit-touch-callout: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  body, button { -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas {
    touch-action: none; -webkit-user-drag: none;
    width: min(100vw, 177.78vh);
    width: min(100vw, 177.78dvh); /* dvh = the visible height, so the bottom isn't hidden behind Safari's toolbar */
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    background: #8fd3ff;
  }
  #controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none; justify-content: space-between; align-items: flex-end;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  @media (pointer: coarse) { #controls { display: flex; } }
  #controls .group { display: flex; gap: 20px; }
  #controls button {
    pointer-events: auto; position: relative; padding: 0;
    width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.7); background: rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  /* invisible extra hit area so a thumb that lands near the edge still counts */
  #controls button::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; }
  /* the arrows are SVG shapes, not text, so iOS has nothing to select or magnify */
  #controls svg { width: 40%; height: 40%; fill: #fff; pointer-events: none; }
  #controls button.on { background: rgba(255,255,255,.5); }
  /* portrait phone: game.js (layout) makes the canvas tall and narrow, and the buttons sit under it */
  .portrait #controls { position: static; width: 100%; box-sizing: border-box; flex: none; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .portrait #controls button { width: min(108px, 20vw); height: min(108px, 20vw); }
  .portrait #controls .group { gap: 10px; }
</style>
</head>
<body>
<canvas id="game" width="320" height="180"></canvas>
<div id="controls">
  <div class="group">
    <button data-key="left" aria-label="left"><svg viewBox="0 0 100 100"><path d="M80 8 L80 92 L12 50 Z"/></svg></button>
    <button data-key="right" aria-label="right"><svg viewBox="0 0 100 100"><path d="M20 8 L20 92 L88 50 Z"/></svg></button>
  </div>
  <div class="group">
    <button data-key="down" aria-label="down"><svg viewBox="0 0 100 100"><path d="M8 20 L92 20 L50 88 Z"/></svg></button>
    <button data-key="jump" aria-label="jump"><svg viewBox="0 0 100 100"><path d="M8 80 L92 80 L50 12 Z"/></svg></button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
